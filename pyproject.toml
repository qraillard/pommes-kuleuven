[project]
name = "pommes"
version = "0.5.0+kul" # own versioning restarted 2026-07-24; 0.1.0: trade links, weighted hurdle costs, transport delay; 0.2.0: conversion_max_capacity_factor, defaults instead of presence checks; 0.3.0: transport_fuel_area; 0.4.0: exact annuity rates (no finance-rate grid), annuity_mode full_life default (legacy until_decommissioning), check_inputs life-span max per variable, an invest cost with a NaN finance rate raises (life span 0 or NaN: warning); load shedding and spillage as powers for time steps over 1 h, process minimum times in cumulative form; 0.4.1: until_decommissioning chooses the annuity per vintage (no duplicated cost rows); transport variables only for the (link, tech) pairs that carry a resource; constant operation: one equality P_t = P_(t-1) instead of the ramp inequalities where the ramps of a conversion or combined unit are 0 (combined: on the sum over modes, or on every mode if the mode ramps are 0 too); carbon tax on groups of areas (optional carbon_tax_group, carbon_tax_group_areas, carbon_tax_group_rate: the group pays max(0, rate x net emissions of its members), the per-area carbon_tax is masked for the members; unchanged without them); minimum storage energy-to-power ratio in hours (optional storage_energy_to_power_min: energy capacity >= ratio x power capacity where set; unchanged without it); 0.5.0: year_dec is optional in the study coords, derived from the life spans (derive_year_dec: the ends of life, year_inv, year_op, year_ret) so that capacity ends exactly at year_inv + life_span; a listed year_dec behaves as before
description = "Planning and Operation Model for Multi-Energy Systems"
authors = [
    { name = "Quentin Raillard", email = "quentin.raillard--cazanove@kuleuven.be" }
]
license = "MIT"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10,<4.0.0"
dependencies = [
    "pandas",
    "xarray",
    "linopy",
    "numpy",
    "pyyaml",
    "highspy",
    "h5netcdf",
    "h5py"
]
[project.optional-dependencies]
notebooks = [
    "notebook",
    "ipykernel",
    "ipython",
    "nbformat"
]
visualisation = [
    "matplotlib",
]
pre-process = [
    "pommes-pre-process"
]
all = [
    "notebook",
    "ipykernel",
    "ipython",
    "nbformat",
    "matplotlib",
    "pommes-pre-process"
]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"


[tool.setuptools.package-data]
"*" = ["*.csv", "*.yaml"]

# Formatter and linter settings

[tool.ruff]
extend-include = ['*.ipynb']
line-length = 79

[tool.ruff.lint]
select = [
    'F',   # pyflakes
    'E',   # pycodestyle: Error
    'W',   # pycodestyle: Warning
    'I',   # isort
    'D',   # pydocstyle
    'UP',  # pyupgrade
    'ANN', # flake-8 annotations
    'TID', # flake8-tidy-imports
    'NPY', # numpy
    'RUF013', # ruff
]

ignore = [
    'D203', # 1 blank line required before class docstring
    'D212', # Multi-line docstring summary should start at the second line
    'D401', # First line should be in imperative mood
#    'E501', # Line too long
    ]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-line-length = 99


[tool.ruff.lint.per-file-ignores]
# pydocstyle ignores, which could be enabled in future when existing
# issues are fixed
"{pommes/tests,pommes/examples,docs}/**"=[
    'ANN', # flake8-annotations
    'D100', # Missing docstring in public module
    'D101', # Missing docstring in public class
    'D102', # Missing docstring in public method
    'D103', # Missing docstring in public function
    'D105', # Missing docstring in magic method
    'D107', # Missing docstring in __init__
    'D200', # One-line docstring should fit on one line with quotes
    'D202', # No blank lines allowed after function docstring
    'D205', # 1 blank line required between summary line and description
    'D400', # First line should end with a period
    'D404', # First word of the docstring should not be "This
    'D413', # Missing blank line after last section
    'D415', # First line should end with a period, question mark, or exclamation point
    'D417', # Missing argument descriptions in the docstring
]


[tool.ruff.lint.flake8-tidy-imports]
# Disallow all relative imports.
ban-relative-imports = "all"
