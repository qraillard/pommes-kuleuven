  default: 1
  index_set:
  - hour
  type: float64
  description: "Length of each time step, in hours (1 = hourly). Intensive data (availabilities, prices, emission factors, ...) are averages over the step; per-step quantities (demand, flexdem_demand, net imports) are sums over the step. Power variables (including load shedding and spillage) are multiplied by this duration in the energy balances; windows (flexdem_conservation_hrs, daily production limits) are counted in hours. The process module is only valid at 1 h steps (a warning is emitted otherwise)."
